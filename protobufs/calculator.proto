syntax = "proto3";

service Calculator {
  rpc Add (AddRequest) returns (AddResponse);
  rpc Multiply (MultiplyRequest) returns (MultiplyResponse);
}

message AddRequest {
  int32 number1 = 1;
  int32 number2 = 2;
}

message AddResponse {
  int32 result = 1;
}

message MultiplyRequest {
  int32 input1 = 1;
  int32 input2 = 2;
}

message MultiplyResponse {
  int32 result = 1;
}