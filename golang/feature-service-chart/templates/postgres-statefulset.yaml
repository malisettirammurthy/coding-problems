{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "feature-service.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "feature-service.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "feature-service.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "feature-service.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "feature-service.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      volumes:
        - name: data
          emptyDir: {}
        - name: init-sql
          configMap:
            name: {{ include "feature-service.fullname" . }}-postgres-init
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
              name: postgres
          envFrom:
            - secretRef:
                name: {{ include "feature-service.fullname" . }}-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
{{- end }}
