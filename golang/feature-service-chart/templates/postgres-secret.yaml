{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "feature-service.fullname" . }}-postgres
type: Opaque
data:
  POSTGRES_USER: {{ .Values.postgres.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | b64enc | quote }}
  DATABASE_URL: {{ include "feature-service.databaseUrl" . | b64enc | quote }}
{{- end }}
